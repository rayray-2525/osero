<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:#e8f3ff;font-family:'Barlow Condensed','Noto Sans JP',sans-serif}canvas{display:block;width:100%;height:100%;cursor:crosshair}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 38%,rgba(3,5,12,.5) 100%);z-index:1}.scanlines{position:fixed;inset:0;pointer-events:none;opacity:.12;z-index:2;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(10,18,33,.45) 4px)}
#hud{position:fixed;inset:0;z-index:3;pointer-events:none}.top{position:absolute;top:26px;left:32px;display:flex;align-items:flex-start;gap:16px}.logo{font-weight:800;font-size:25px;letter-spacing:2px;color:#effaff;text-shadow:0 0 16px #27dff2}.logo span{color:#ff3ea5}.sub{font-size:10px;letter-spacing:2px;color:#77a9bf;margin-top:2px}.district{border-left:1px solid #3be6ed;padding:2px 0 2px 12px;margin-top:4px;color:#d5fbff;font-size:12px;letter-spacing:1.4px}.district small{display:block;color:#698896;font-size:9px;letter-spacing:2px}.right{position:absolute;right:32px;top:28px;text-align:right}.clock{font-size:19px;letter-spacing:2px;color:#e7fbff}.weather{font-size:10px;color:#7fa6b8;letter-spacing:1.5px;margin-top:3px}.speedbox{position:absolute;right:32px;bottom:34px;text-align:right}.speed{font-size:52px;font-weight:700;line-height:.9;color:#ecfbff;text-shadow:0 0 20px #16d7e7}.speed small{font-size:11px;color:#7ca0af;letter-spacing:2px}.meter{height:2px;width:140px;margin:9px 0 0 auto;background:#1b2937}.meter i{display:block;height:100%;width:30%;background:#20e7ed;box-shadow:0 0 10px #20e7ed}.prompt{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);font-size:12px;letter-spacing:1px;background:rgba(4,11,19,.75);border:1px solid #247b89;padding:9px 16px;color:#d9fbff;box-shadow:0 0 20px #16bbd426}.prompt b{color:#31e7ed;margin-right:7px}.help{position:absolute;left:32px;bottom:28px;color:#7394a1;font-size:11px;letter-spacing:.6px;line-height:1.8}.help strong{color:#d5f5f6;font-weight:600}.minimap{position:absolute;right:30px;top:92px;width:132px;height:132px;border:1px solid #246a76;background:rgba(4,11,19,.79);box-shadow:0 0 18px #07ccde22}.minimap canvas{width:100%;height:100%}.tag{position:absolute;top:calc(50% - 80px);left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:2px;color:#35e8ec;text-shadow:0 0 12px #00eaff}.crosshair{position:absolute;top:50%;left:50%;width:5px;height:5px;border:1px solid rgba(151,239,244,.75);border-radius:50%;transform:translate(-50%,-50%)}.intro{position:fixed;z-index:5;inset:0;background:linear-gradient(110deg,rgba(3,8,17,.97) 0%,rgba(4,13,24,.87) 48%,rgba(5,8,18,.57) 100%);display:flex;align-items:center;padding:8vw;transition:opacity .6s,visibility .6s}.intro.hide{opacity:0;visibility:hidden}.intro:after{content:'';position:absolute;right:7vw;top:10vh;width:38vw;height:80vh;border:1px solid #23dce62e;background:linear-gradient(135deg,#14c6dd0b,#ff248c0c);clip-path:polygon(15% 0,100% 0,100% 100%,0 86%);pointer-events:none}.intro-content{max-width:560px;position:relative;z-index:1}.eyebrow{font-size:11px;letter-spacing:4px;color:#43e8ec;margin-bottom:18px}.intro h1{font-size:clamp(52px,8vw,106px);line-height:.79;margin:0 0 24px;font-weight:800;letter-spacing:-1px;text-shadow:0 0 32px #28e3f333}.intro h1 em{font-style:normal;color:#ff4099}.intro p{max-width:410px;color:#9bb3c2;font-family:'Noto Sans JP',sans-serif;font-size:13px;line-height:1.9}.launch{margin-top:30px;background:transparent;border:1px solid #31e2e8;padding:13px 24px;color:#e4ffff;font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:2px;cursor:pointer;box-shadow:0 0 22px #00e5ef1c;transition:.2s}.launch:hover{background:#21dce5;color:#041016;box-shadow:0 0 30px #00e5ef77}.launch span{color:#ff499e;margin-left:15px}.keys{margin-top:26px;color:#718b98;font-size:10px;letter-spacing:1px}.keys b{color:#9fcbd1;font-weight:500}.mobile{display:none}
@media(max-width:700px){.top{left:15px;top:15px}.right{right:15px;top:18px}.minimap{right:14px;top:78px;width:102px;height:102px}.help{left:14px;bottom:14px;font-size:9px}.speedbox{right:15px;bottom:18px}.speed{font-size:40px}.prompt{bottom:80px;white-space:nowrap}.district{display:none}.intro{padding:26px}.intro:after{right:2vw;width:42vw;opacity:.5}.intro p{font-size:12px}.keys{line-height:1.8}.mobile{display:block;position:fixed;z-index:4;bottom:18px;left:50%;transform:translateX(-50%);width:150px;height:56px;pointer-events:none}.mobile button{pointer-events:auto;position:absolute;width:46px;height:46px;border:1px solid #56dfe477;background:#071620bb;color:#dbffff;font-size:18px;border-radius:50%;touch-action:none}.mobile .up{left:52px;top:0}.mobile .left{left:0;top:0}.mobile .right{right:0;top:0}.mobile .down{left:52px;top:0;display:none}}
</style></head><body>
<canvas id="game"></canvas><div class="vignette"></div><div class="scanlines"></div>
<div id="hud"><div class="top"><div><div class="logo">NEON<span>//</span>DISTRICT</div><div class="sub">NIGHT CITY DRIVE</div></div><div class="district"><small>SECTOR 07</small>SHINJUKU EAST</div></div><div class="right"><div class="clock">23:47 <span style="color:#ff459d">●</span></div><div class="weather">ACID RAIN　//　18°C</div></div><div class="minimap"><canvas id="map"></canvas></div><div class="crosshair"></div><div class="tag" id="tag">FREE ROAM</div><div class="prompt" id="prompt"><b>E</b> 車に乗る</div><div class="help"><strong>W A S D</strong>　移動 / 運転　　<strong>マウス</strong>　視点　　<strong>E</strong>　乗る・降りる<br><strong>SHIFT</strong>　ダッシュ / ブースト　　<strong>SPACE</strong>　ブレーキ</div><div class="speedbox" id="speedbox" style="display:none"><div class="speed"><span id="speed">000</span> <small>KM/H</small></div><div class="meter"><i id="fuel"></i></div></div></div>
<div class="mobile" id="mobile"><button class="left" data-key="a">◀</button><button class="up" data-key="w">▲</button><button class="right" data-key="d">▶</button></div>
<div class="intro" id="intro"><div class="intro-content"><div class="eyebrow">WELCOME TO THE AFTERHOURS</div><h1>NEON<br><em>DISTRICT</em></h1><p>眠らない街、ネオンが雨に滲む。<br>路地を歩き、見つけた車で夜の街を駆け抜けろ。</p><button class="launch" id="start">街へ出る <span>▶</span></button><div class="keys"><b>WASD</b> 移動　 <b>MOUSE</b> 視点　 <b>E</b> 乗降　 <b>SHIFT</b> ダッシュ / ブースト</div></div></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),mapCanvas=document.querySelector('#map'),mctx=mapCanvas.getContext('2d');let W,H,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);mapCanvas.width=mapCanvas.clientWidth*DPR;mapCanvas.height=mapCanvas.clientHeight*DPR;mctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault();if(e.key.toLowerCase()==='e')toggleCar()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let player={x:0,z:0,yaw:0},cameraYaw=0,carMode=false,activeCar=null,speed=0,mouseDown=false,started=false;
canvas.addEventListener('click',()=>canvas.requestPointerLock?.());document.addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas)cameraYaw+=e.movementX*.0025});
document.querySelector('#start').onclick=()=>{document.querySelector('#intro').classList.add('hide');started=true;canvas.requestPointerLock?.()};
document.querySelectorAll('.mobile button').forEach(b=>{b.addEventListener('touchstart',e=>{e.preventDefault();keys[b.dataset.key]=true});b.addEventListener('touchend',()=>keys[b.dataset.key]=false)});
// City grid: avenues at 40-unit intervals, with procedural blocks and parked cars.
const buildings=[],cars=[],neon=['#17dce8','#fa3191','#a949ff','#ffb72b','#54e8ad'];let seed=721;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let gx=-8;gx<=8;gx++)for(let gz=-8;gz<=8;gz++){if(gx===0&&gz===0)continue;let x=gx*40,z=gz*40;for(let j=0;j<2;j++)for(let k=0;k<2;k++){if(rand()<.19)continue;let bx=x+(j?13:-13)+(rand()-.5)*5,bz=z+(k?13:-13)+(rand()-.5)*5,w=8+rand()*6,d=8+rand()*6,h=12+rand()*58;if(rand()<.17)h+=30;buildings.push({x:bx,z:bz,w,d,h,col:['#101d30','#142035','#111827','#1a1931'][Math.floor(rand()*4)],glow:neon[Math.floor(rand()*neon.length)],seed:rand()})}}
for(let gx=-7;gx<=7;gx++)for(let gz=-7;gz<=7;gz++){if(rand()<.53){let laneX=gx*40+(rand()<.5?-1:1)*7,laneZ=gz*40+(rand()-.5)*20;cars.push({x:laneX,z:laneZ,yaw:rand()<.5?Math.PI/2:-Math.PI/2,color:neon[Math.floor(rand()*neon.length)],speed:0,parked:true})}if(rand()<.45){let laneZ=gz*40+(rand()<.5?-1:1)*7,laneX=gx*40+(rand()-.5)*20;cars.push({x:laneX,z:laneZ,yaw:rand()<.5?0:Math.PI,color:neon[Math.floor(rand()*neon.length)],speed:0,parked:true})}}
// Fixed camera basis plus perspective projection; geometry is sorted back to front.
let cam={x:0,y:7,z:-12,yaw:0,pitch:.28};function forward(y){return{x:Math.sin(y),z:Math.cos(y)}}
function project(x,y,z){let dx=x-cam.x,dz=z-cam.z,cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),xx=dx*cy-dz*sy,dd=dx*sy+dz*cy;let cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),yy=(y-cam.y)*cp-dd*sp,dep=dd*cp+(y-cam.y)*sp;if(dep<.3)return null;let f=Math.min(W,H)*.92;return{x:W*.5+xx*f/dep,y:H*.54-yy*f/dep,d:dep}}
const faces=[];function addFace(points,color,stroke=null){let ps=points.map(p=>project(...p));if(ps.some(p=>!p))return;let dep=ps.reduce((a,p)=>a+p.d,0)/ps.length;faces.push({ps,color,stroke,dep})}
function box(x,y,z,w,h,d,color,edge){let x1=x-w/2,x2=x+w/2,z1=z-d/2,z2=z+d/2,y1=y,y2=y+h;let coords=[[[x1,y1,z1],[x2,y1,z1],[x2,y2,z1],[x1,y2,z1]],[[x2,y1,z1],[x2,y1,z2],[x2,y2,z2],[x2,y2,z1]],[[x2,y1,z2],[x1,y1,z2],[x1,y2,z2],[x2,y2,z2]],[[x1,y1,z2],[x1,y1,z1],[x1,y2,z1],[x1,y2,z2]],[[x1,y2,z1],[x2,y2,z1],[x2,y2,z2],[x1,y2,z2]],[[x1,y1,z2],[x2,y1,z2],[x2,y1,z1],[x1,y1,z1]]];for(let i=0;i<6;i++)addFace(coords[i],i===4?shade(color,1.18):shade(color,[.74,.88,.72,.84,.95,.55][i]),edge)}function shade(c,m){let n=parseInt(c.slice(1),16),r=Math.min(255,((n>>16)&255)*m)|0,g=Math.min(255,((n>>8)&255)*m)|0,b=Math.min(255,(n&255)*m)|0;return`rgb(${r},${g},${b})`}
function line3(a,b,color,width=1){let p=project(...a),q=project(...b);if(!p||!q)return;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}
function drawRoads(){let range=230, step=40;for(let i=-6;i<=6;i++){let c=i*step;let p1=project(c,0,-range),p2=project(c,0,range);if(p1&&p2){ctx.strokeStyle='#141a28';ctx.lineWidth=Math.max(3,Math.min(80,1000/Math.max(p1.d,p2.d)));ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();ctx.strokeStyle='#25304555';ctx.lineWidth=1;ctx.setLineDash([8,12]);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();ctx.setLineDash([])}let q1=project(-range,0,c),q2=project(range,0,c);if(q1&&q2){ctx.strokeStyle='#141a28';ctx.lineWidth=Math.max(3,Math.min(80,1000/Math.max(q1.d,q2.d)));ctx.beginPath();ctx.moveTo(q1.x,q1.y);ctx.lineTo(q2.x,q2.y);ctx.stroke()}}}
function drawBuilding(b){let x=b.x,z=b.z,w=b.w,d=b.d,h=b.h,x1=x-w/2,x2=x+w/2,z1=z-d/2,z2=z+d/2;box(x,0,z,w,h,d,b.col);for(let floor=4;floor<h-2;floor+=5){for(let side=0;side<4;side++){let a,bp;if(side===0){a=[x1+.5,floor,z1-.02];bp=[x2-.5,floor,z1-.02]}else if(side===1){a=[x2+.02,floor,z1+.5];bp=[x2+.02,floor,z2-.5]}else if(side===2){a=[x2-.5,floor,z2+.02];bp=[x1+.5,floor,z2+.02]}else{a=[x1-.02,floor,z2-.5];bp=[x1-.02,floor,z1+.5]}let pa=project(...a),pb=project(...bp);if(!pa||!pb)continue;ctx.strokeStyle=(Math.sin(floor*13+b.seed*99)>.0?b.glow:'#67a4bf')+'55';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke()}}// rooftop beacon
line3([x-w*.35,h,z],[x-w*.35,h+4,z],b.glow,1.5)}
function drawCar(c){let f=forward(c.yaw),rx=Math.cos(c.yaw),rz=-Math.sin(c.yaw);function local(a,b,yy){return[c.x+rx*a+f.x*b,yy,c.z+rz*a+f.z*b]}let pts=[local(-1, -2,0),local(1,-2,0),local(1,2,0),local(-1,2,0)];let base=pts.map(p=>[p[0],.25,p[2]]),top=pts.map((p,i)=>[p[0],i<2?1.1:.8,p[2]]);for(let i=0;i<4;i++)addFace([base[i],base[(i+1)%4],top[(i+1)%4],top[i]],shade(c.color,.52),c.color+'88');addFace([top[0],top[1],top[2],top[3]],shade(c.color,.75),c.color);let roof=[local(-.72,-.4,0),local(.72,-.4,0),local(.62,1.1,0),local(-.62,1.1,0)].map((p,i)=>[p[0],i<2?1.15:.9,p[2]]);addFace(roof,'#172b3c','#6db8cd88');for(let side of [-1,1]){let p=project(...local(side*.8,2,.45));if(p){ctx.fillStyle='#ff386d';ctx.shadowColor='#ff244f';ctx.shadowBlur=10;ctx.fillRect(p.x-2,p.y-2,4,3);ctx.shadowBlur=0}}}
function drawPlayer(){let f=forward(player.yaw);let x=player.x,z=player.z;box(x,0.12,z,.75,1.2,.5,'#142c39','#3bededaa');box(x,1.25,z,.48,.55,.46,'#273747','#3bededaa');box(x-.17,.25,z,.18,.32,.2,'#ff3f9c');box(x+.17,.25,z,.18,.32,.2,'#19e3e8');line3([x,1.5,z],[x+f.x*.35,1.4,z+f.z*.35],'#e9ffff',2)}
function toggleCar(){if(!started)return;if(carMode){carMode=false;player.x=activeCar.x+2.2;player.z=activeCar.z;activeCar=null;speed=0}else{let c=cars.find(c=>Math.hypot(c.x-player.x,c.z-player.z)<5);if(c){activeCar=c;carMode=true;speed=0}}}
function update(dt){let f=forward(carMode?activeCar.yaw:player.yaw),rot=carMode?activeCar.yaw:player.yaw;if(!carMode){if(keys.a)cameraYaw-=dt*1.5;if(keys.d)cameraYaw+=dt*1.5;player.yaw=cameraYaw;let v=(keys.w?1:0)-(keys.s?1:0),strafe=(keys.d?1:0)-(keys.a?1:0);let mag=Math.hypot(v,strafe)||1,sp=(keys.shift?11:6)*dt;player.x+=(f.x*v+Math.cos(rot)*strafe)/mag*sp;player.z+=(f.z*v-Math.sin(rot)*strafe)/mag*sp;cam.yaw=cameraYaw;cam.x=player.x-f.x*8;cam.z=player.z-f.z*8;cam.y=6.2}else{let accel=(keys.w?20:0)-(keys.s?13:0);speed+=accel*dt;speed*=Math.pow(keys[' ']?.91:.988,dt*60);speed=Math.max(-12,Math.min(keys.shift?37:22,speed));activeCar.yaw+=(keys.a?1:0)-(keys.d?1:0);activeCar.yaw*=Math.pow(.997,dt*60);let cf=forward(activeCar.yaw);activeCar.x+=cf.x*speed*dt;activeCar.z+=cf.z*speed*dt;player.x=activeCar.x;player.z=activeCar.z;player.yaw=activeCar.yaw;cam.yaw=activeCar.yaw;cam.x=player.x-cf.x*10;cam.z=player.z-cf.z*10;cam.y=7.3}let targetX=carMode?activeCar.x:player.x,targetZ=carMode?activeCar.z:player.z;cam.x=targetX-f.x*(carMode?10:8);cam.z=targetZ-f.z*(carMode?10:8);}
function drawMinimap(){let w=mapCanvas.clientWidth,h=mapCanvas.clientHeight;mctx.clearRect(0,0,w,h);mctx.fillStyle='#07111b';mctx.fillRect(0,0,w,h);let scale=w/100;mctx.strokeStyle='#253548';mctx.lineWidth=5;for(let i=-2;i<=2;i++){let p=w/2+i*40*scale;mctx.beginPath();mctx.moveTo(p,0);mctx.lineTo(p,h);mctx.stroke();mctx.beginPath();mctx.moveTo(0,p);mctx.lineTo(w,p);mctx.stroke()}mctx.fillStyle='#a949ff';for(let b of buildings){let x=w/2+(b.x-player.x)*scale,y=h/2+(b.z-player.z)*scale;if(x>0&&x<w&&y>0&&y<h)mctx.fillRect(x-1,y-1,2,2)}mctx.fillStyle='#fa3191';for(let c of cars){let x=w/2+(c.x-player.x)*scale,y=h/2+(c.z-player.z)*scale;if(x>0&&x<w&&y>0&&y<h)mctx.fillRect(x-1.5,y-1.5,3,3)}mctx.fillStyle='#45f6f1';mctx.beginPath();mctx.arc(w/2,h/2,3,0,Math.PI*2);mctx.fill();mctx.strokeStyle='#45f6f1';mctx.beginPath();mctx.moveTo(w/2,h/2);mctx.lineTo(w/2+Math.sin(player.yaw)*12,h/2+Math.cos(player.yaw)*12);mctx.stroke()}
function render(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#070b19');sky.addColorStop(.52,'#161327');sky.addColorStop(1,'#10111b');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);let horizon=H*.54;let glow=ctx.createRadialGradient(W*.52,horizon,2,W*.52,horizon,H*.65);glow.addColorStop(0,'#ff2d8529');glow.addColorStop(1,'transparent');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);drawRoads();faces.length=0;let range=170;for(let b of buildings)if(Math.abs(b.x-player.x)<range&&Math.abs(b.z-player.z)<range)drawBuilding(b);for(let c of cars)if(Math.abs(c.x-player.x)<range&&Math.abs(c.z-player.z)<range)drawCar(c);if(carMode)drawCar(activeCar);else drawPlayer();faces.sort((a,b)=>b.dep-a.dep);for(let o of faces){ctx.beginPath();ctx.moveTo(o.ps[0].x,o.ps[0].y);for(let i=1;i<o.ps.length;i++)ctx.lineTo(o.ps[i].x,o.ps[i].y);ctx.closePath();ctx.fillStyle=o.color;ctx.fill();if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=.8;ctx.stroke()}}// rain streaks
ctx.strokeStyle='#8cd9e326';ctx.lineWidth=.7;for(let i=0;i<85;i++){let x=(i*137+performance.now()*.07)%W,y=(i*79+performance.now()*.18)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-2,y+8+(i%8));ctx.stroke()}drawMinimap();let near=cars.find(c=>Math.hypot(c.x-player.x,c.z-player.z)<5);document.querySelector('#prompt').style.display=near||carMode?'block':'none';document.querySelector('#prompt').innerHTML=carMode?'<b>E</b> 車から降りる':'<b>E</b> 車に乗る';document.querySelector('#speedbox').style.display=carMode?'block':'none';document.querySelector('#speed').textContent=String(Math.round(Math.abs(speed)*4)).padStart(3,'0');document.querySelector('#fuel').style.width=Math.min(100,Math.abs(speed)*2.6)+'%';document.querySelector('#tag').textContent=carMode?'VEHICLE // '+(speed>1?'DRIVING':'IDLE'):'FREE ROAM'}
let last=performance.now();function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;if(started)update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
